services:
  neurovision-ai:
    build: .
    container_name: neurovision_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - SECRET_KEY=neurovision-docker-secret-key-2026
      - PORT=5000
    volumes:
      - ./database:/app/database
      - ./static/uploads:/app/static/uploads
      - ./static/gradcam_outputs:/app/static/gradcam_outputs
      - ./static/reports:/app/static/reports
    restart: unless-stopped
